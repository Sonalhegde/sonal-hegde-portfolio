name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare local hosting config
        run: |
          mkdir -p .openai
          printf '{"d1":null,"r2":null}\n' > .openai/hosting.json

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages artifact
        env:
          NEXT_PUBLIC_BASE_PATH: /sonal-hegde-portfolio
          NEXT_PUBLIC_SITE_URL: https://sonalhegde.github.io/sonal-hegde-portfolio/
          STATIC_OUTPUT_DIR: github-pages-dist
          STATIC_SITE_URL: https://sonalhegde.github.io/sonal-hegde-portfolio/
        run: |
          npm run build
          node scripts/export-static.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
